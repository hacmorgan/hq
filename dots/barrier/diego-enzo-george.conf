section: options
	# Bring the cursor home before locking: while it is on a client screen,
	# barriers holds enzo's keyboard/pointer grab and i3lock cannot lock.
	# Pressed by dots/i3/lock-screen via dots/i3/barrier-home.
	keystroke(Control+Alt+Super+Shift+F12) = switchToScreen(enzo)
	relativeMouseMoves = false
	screenSaverSync = true
	win32KeepForeground = false
	clipboardSharing = true
	switchCorners = none 
	switchCornerSize = 0
end

